# Dependency policy, checked by `cargo deny check` (CI's `deny` job).
# Weakening anything here needs a stated reason next to the change and the user's agreement.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Every advisory is denied. An ignore needs an id, a reason, and the user's agreement.
ignore = []

[licenses]
version = 2
# Permissive licences only, all compatible with shipping an MIT binary.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
# Scoped to one crate, not added to `allow`. webpki-roots is Mozilla's CA bundle, pulled in by
# ureq's rustls feature (issue #5) so TLS trusts the same roots on all six targets. CDLA-Permissive-2.0
# is the Linux Foundation's permissive data licence: attribution only, no copyleft. It covers the
# certificate data and no other crate. Needs the user's agreement; see the issue #5 PR.
exceptions = [{ allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" }]

[bans]
# Duplicate versions are reported, not fatal: windows-* crates routinely appear twice. A new
# duplicate still needs a reason (`cargo tree -d`). Promote to "deny" with a skip list if it grows.
multiple-versions = "warn"
# Wildcard version requirements are banned, except path dependencies inside this workspace.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
