name: CI

# The same `just` recipes the git hooks run. Rust jobs report green, with a visible notice, while
# the repository has no Cargo.toml (#3), so the required checks exist from day one and switch on by
# themselves once the workspace lands. See scripts/ci-detect.sh.
#
# A pull request that changes no Rust-relevant file (only docs, Markdown, .claude/, or another
# workflow) skips the Rust work the same way. The `changes` job runs dorny/paths-filter and
# publishes `code`; the Rust jobs still start, so every required check still reports under its
# own name (a matrix job skipped by a job-level `if:` reports one unexpanded name and would leave
# `test (ubuntu-latest)` waiting forever), then skip their steps with a notice. Only a definite
# `code == 'false'` skips: if `changes` fails or is skipped, the output is empty and everything
# runs. A push to main runs everything. See docs/references/dev_workflow.md#quality-gates.

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Snapshot updates are never allowed in CI: a changed snapshot is a failing test.
  INSTA_UPDATE: "no"

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists a PR's files through the API
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # No checkout: on a pull request the action reads the changed files from the API. On a push
      # the step is skipped, `code` is empty, and every job runs unfiltered.
      - if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            code:
              - "crates/**"
              - "tests/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "**/Cargo.toml"
              - "rust-toolchain.toml"
              - "rustfmt.toml"
              - "clippy.toml"
              - ".config/nextest.toml"
              - "deny.toml"
              - ".cargo/**"
              - "justfile"
              - "scripts/ci-detect.sh"
              - "scripts/ci-install-rust.sh"
              - ".github/workflows/ci.yml"

  lint:
    name: lint
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: detect
        env:
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
        run: sh scripts/ci-detect.sh
      - if: steps.detect.outputs.rust == 'true'
        run: sh scripts/ci-install-rust.sh
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.59.0
      - if: steps.detect.outputs.rust == 'true'
        run: just lint

  lint-md:
    name: lint-md
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.59.0
      - run: just lint-md

  scripts:
    name: scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.59.0
      - run: just test-scripts
      # The scrubber and goldens generator tests, including one end-to-end run of the reference.
      - run: just test-py

  test:
    name: test (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: detect
        shell: bash
        env:
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
        run: sh scripts/ci-detect.sh
      - if: steps.detect.outputs.rust == 'true'
        shell: bash
        run: sh scripts/ci-install-rust.sh
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.59.0,cargo-nextest@0.9.151
      # nextest fails a run that matches no tests, then the doctests run separately: see the
      # `test` recipe and docs/references/testing.md#false-greens.
      - if: steps.detect.outputs.rust == 'true'
        run: just test

  msrv:
    name: msrv
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: detect
        env:
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
        run: sh scripts/ci-detect.sh
      - name: Require a declared rust-version
        if: steps.detect.outputs.rust == 'true' && steps.detect.outputs.msrv == ''
        run: |
          echo "::error title=No MSRV declared::Cargo.toml has no rust-version; declare one so the MSRV job has something to check"
          exit 1
      - if: steps.detect.outputs.rust == 'true'
        env:
          MSRV: ${{ steps.detect.outputs.msrv }}
        run: sh scripts/ci-install-rust.sh "$MSRV"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.59.0,cargo-nextest@0.9.151
      - if: steps.detect.outputs.rust == 'true'
        run: just test

  deny:
    name: deny
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: detect
        env:
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
        run: sh scripts/ci-detect.sh
      - if: steps.detect.outputs.deny == 'true'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2
      - if: steps.detect.outputs.deny == 'true'
        run: cargo deny check

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # sha256 of gitleaks_<version>_linux_x64.tar.gz from the release's checksums file. The
      # version itself comes from the justfile; bumping one without the other fails the check.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.59.0
      - name: Install gitleaks
        run: |
          version=$(just --evaluate gitleaks_version)
          curl -fsSL --retry 3 -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tar.gz gitleaks
      # Only what HEAD reaches: on a PR that is main's full history plus the PR's own commits.
      # fetch-depth: 0 also fetches every other branch, and a leak there must not fail this PR.
      - run: just secret-scan --log-opts=HEAD
