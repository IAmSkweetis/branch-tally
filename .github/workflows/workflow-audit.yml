name: Workflow audit

# zizmor, with online audits, whenever the automation itself changes. The pre-commit hook runs the
# same pinned version offline.

on:
  pull_request:
    paths:
      - ".github/**"
      - "justfile"
  push:
    branches: [main]
    paths:
      - ".github/**"
      - "justfile"

permissions: {}

concurrency:
  group: workflow-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.59.0
      - name: Audit .github/ (online)
        env:
          GH_TOKEN: ${{ github.token }}
        run: just audit-workflows
