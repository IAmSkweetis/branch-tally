name: Feature request
description: Suggest a new capability or a change to an existing one.
title: "feat: "
labels: [enhancement]
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://github.com/IAmSkweetis/branch-tally/milestone/1) first: it may
        already be planned. Name the issue as a Conventional Commit, for example
        `feat(cli): add --json output to branch-tally report`. Issues are public, so don't paste
        transcript content.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What branch-tally should do. Example commands or output help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds, and why they fall short.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have not pasted any transcript content, secrets or tokens.
          required: true
