    url: https://github.com/IAmSkweetis/branch-tally/security/advisories/new
    about: Report privately. Never open a public issue for a vulnerability; see SECURITY.md.
  - name: Roadmap
    url: https://github.com/IAmSkweetis/branch-tally/milestone/1
    about: Planned work. Check here before requesting a feature.
