version: 2

# Commit and PR titles must be Conventional Commits (the PR-title check enforces it), so every
# ecosystem sets a prefix: `ci(deps): ...` for workflow actions, `build(deps): ...` for crates.
# Dependabot's branches (dependabot/...) are exempt from the Conventional Branch check.
#
# A new release must be a week old before Dependabot proposes it, and updates arrive grouped,
# so a stolen or yanked release has time to be caught and a week yields one PR, not ten.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
