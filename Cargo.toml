[workspace]
resolver = "3"
members = ["crates/branch-tally-core", "crates/branch-tally"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
repository = "https://github.com/IAmSkweetis/branch-tally"

# Versions are declared here once; crates say `foo.workspace = true`. Each entry was approved
# through the Workspace Config Steward (issue #3).
[workspace.dependencies]
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
thiserror = "2.0.21"
tempfile = { version = "3.27.0", default-features = false }
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
insta = { version = "1.49.0", default-features = false }
# issue #5: parse the bundled and user price tables. Deserialize only: no `display` (writing),
# no `preserve_order`, no `fast_hash`.
toml = { version = "1.2.1", default-features = false, features = ["std", "parse", "serde"] }
# issue #5: `prices update` fetches one JSON file over HTTPS. rustls with the ring provider and
# bundled webpki roots: no OpenSSL, no system trust store, same behaviour on all six targets.
# gzip, cookies, json, charset and the proxy extras stay off (we deserialize with serde_json).
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
# issue #7: the `--work-branch <regex>` flag (binary crate only; core takes a predicate). regex-lite
# is rust-lang's zero-dependency regex engine by the `regex` maintainers, MIT OR Apache-2.0, built
# for small binaries (no Unicode tables, no aho-corasick/memchr/regex-automata). Branch names are
# short and mostly ASCII, so `regex`'s speed and Unicode data buy nothing. Both features stay on:
# `string` is the `&str` API we call, and `std` only adds the `std::error::Error` impl, which clap's
# value parser needs to carry a bad `--work-branch` pattern. Neither adds a dependency.
regex-lite = { version = "0.1.9", default-features = false, features = ["std", "string"] }
# `branch-tally update`: verify the SHA-256 of a downloaded release archive against SHA256SUMS.
# ring is already in the lockfile (ureq's rustls provider), so `ring::digest` adds zero crates,
# where `sha2` would add several (sha2, digest, block-buffer, crypto-common, ...). Only `digest` is
# used, so no default features are requested by us.
ring = { version = "0.17.14", default-features = false }
# `branch-tally update`: gunzip the release tarball. `rust_backend` is miniz_oxide, pure Rust: no
# libz-sys, no C zlib, so musl and windows-msvc build unchanged. It is also the inflater zip uses.
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
# `branch-tally update`: read the one binary out of the .tar.gz. Extraction only; `xattr` stays
# off, which keeps the xattr/libc extras out. MIT OR Apache-2.0.
tar = { version = "0.4.46", default-features = false }
# `branch-tally update`: read the one binary out of the Windows .zip. Deflate only, through the
# pure-Rust flate2 backend above: no zopfli (a writer), no zlib-rs, no bzip2/zstd/lzma/aes/time.
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# AGENTS.md: bad transcript input is counted, never a panic. clippy.toml exempts tests.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

# A small static binary: size and speed over compile time. panic = "abort" is deliberate, since
# library code returns typed errors and never relies on unwinding.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
