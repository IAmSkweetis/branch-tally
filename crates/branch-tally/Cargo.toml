[package]
name = "branch-tally"
description = "Report what a branch or pull request cost in AI-agent tokens"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "branch-tally"
path = "src/main.rs"

[dependencies]
branch-tally-core = { path = "../branch-tally-core" }
clap.workspace = true
flate2.workspace = true
regex-lite.workspace = true
tar.workspace = true
# `update` reads the latest tag from the GitHub API response (#76): serde_json, not a hand-written
# scanner, on untrusted remote data. Already a normal dependency of core, same workspace features.
serde_json.workspace = true
ureq.workspace = true
zip.workspace = true

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true

[lints]
workspace = true
