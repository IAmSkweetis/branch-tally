# The user manual. Built with mdBook plus the mdbook-mermaid preprocessor; the pinned versions are
# in the justfile (mdbook_version, mdbook_mermaid_version) and must stay mutually compatible.
# mdbook-mermaid only turns ```mermaid fences into <pre class="mermaid">. The Mermaid library
# itself is vendored below, NOT taken from `mdbook-mermaid install` (its newest release, 0.17.1,
# still bundles Mermaid 11.6.0, which has known XSS advisories). mermaid-init.js is the file
# `mdbook-mermaid install` 0.17.1 writes, kept as written.
#
# Vendored, not generated: mermaid.min.js renders the diagrams.
#   version   11.17.2 (Mermaid 11.x; stay on 11.x until the manual is checked against 12)
#   source    https://registry.npmjs.org/mermaid/-/mermaid-11.17.2.tgz, file
#             package/dist/mermaid.min.js. Tarball verified against the registry's dist.integrity
#             sha512-V6K3C8EBdEsPFZXSKMJe6ppQOENxuHARr9GvHX4hh47lAbhMRD9qf4oEK7LoaRQxULMa80/qt5gHO73aCleBBg==
#             and dist.shasum e3caf3717582c0e44e5d04cff043e025caec7cba (sha1)
#   sha256    581ed7d74bd9048d0e3a91363927d72ef22942d7722546b27f7cc29e35390eb8, recorded in
#             mermaid.min.js.sha256 and checked by `just check-pins` (part of `just ci`)
#   licence   MIT, text in mermaid.LICENSE
#   project   https://github.com/mermaid-js/mermaid
#
# mdbook-boot.js and theme/index.hbs are repository tooling: they carry the page's Content-
# Security-Policy and the scripts mdBook's template had inline. Refresh both when mdbook_version
# moves (instructions in theme/index.hbs). `just docs` checks the built pages.
#
# Vendored, not generated: svg-pan-zoom.min.js makes the diagrams zoomable, driven by
# svg-pan-zoom-init.js and styled by svg-pan-zoom.css (all three are repository tooling).
#   version   3.6.2 (the latest release on npm; GitHub's releases page stops at 3.6.1)
#   source    https://registry.npmjs.org/svg-pan-zoom/-/svg-pan-zoom-3.6.2.tgz, file
#             package/dist/svg-pan-zoom.min.js (tarball sha1 be136506211b242627a234a9656f8128fcbbabed)
#   sha256    9c8fc41b3359e699990766dd7a943595d234a80c880a90dfc14b920a273b99d8, recorded in
#             svg-pan-zoom.min.js.sha256 and checked by `just check-pins` (part of `just ci`)
#   licence   BSD-2-Clause, text in svg-pan-zoom.LICENSE
#   project   https://github.com/bumbu/svg-pan-zoom

[book]
title = "branch-tally"
description = "What a branch or pull request cost in AI-agent tokens."
language = "en"
src = "src"

[build]
build-dir = "book"
# A SUMMARY.md entry that points at a missing page fails the build rather than creating an empty one.
create-missing = false

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
# The manual is served from the apex of https://branch-tally.io/, so links are rooted at "/".
site-url = "/"
git-repository-url = "https://github.com/IAmSkweetis/branch-tally"
additional-js = [
    "mdbook-boot.js",
    "mermaid.min.js",
    "mermaid-init.js",
    "svg-pan-zoom.min.js",
    "svg-pan-zoom-init.js",
]
additional-css = ["svg-pan-zoom.css"]
