# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit reviews every non-draft PR against main and is the one approval the `default` ruleset
# requires. The settings and the reasons for them are in docs/references/dev_workflow.md
# ("Code review"). AGENTS.md is read as a coding guideline by default
# (knowledge_base.code_guidelines), so the path instructions below only sharpen it.

language: en-US
early_access: false

reviews:
  profile: chill

  # CodeRabbit requests changes for blocking findings and approves once the latest commit is
  # reviewed, every required thread is resolved and no pre-merge check fails. The author may not
  # approve their own PR with `@coderabbitai approve`: that would skip the finished review, and
  # the author is the only human here, so the command would empty the gate.
  auto_approvals:
    enabled: true
    allow_author_approval: false

  # The squash commit on main is the PR title and description, so nothing CodeRabbit writes may
  # land in the description. The summary goes in the walkthrough comment instead.
  high_level_summary: true
  high_level_summary_in_walkthrough: true

  collapse_walkthrough: true
  poem: false
  in_progress_fortune: false
  sequence_diagrams: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  auto_apply_labels: false

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    # The default pauses reviews after 5 reviewed commits. A paused PR's latest commit is never
    # reviewed, so it can never be approved.
    auto_pause_after_reviewed_commits: 0
    base_branches:
      - "^main$"

  path_filters:
    # Appended to by the capture and record hooks; merged with merge=union.
    - "!.tally/**"
    # The immutable Python reference (AGENTS.md, Tech stack).
    - "!reference/**"
    - "!Cargo.lock"
    # Generated by `just goldens` from the reference.
    - "!tests/fixtures/**/goldens/**"
    # Vendored manual assets, checked by sha256 (`just check-pins`).
    - "!docs/manual/mermaid.min.js"
    - "!docs/manual/mermaid-init.js"
    - "!docs/manual/svg-pan-zoom.min.js"
    # Generated by `just readme-graph`.
    - "!docs/assets/*.svg"

  path_instructions:
    - path: "crates/**/*.rs"
      instructions: |
        Hold the change to AGENTS.md's Governance and Tech stack rules. Flag in particular:
        - `unwrap()`, `expect()`, indexing or any other panic on transcript data outside tests.
          Bad input must be counted and reported, with a typed error.
        - A record that is dropped, skipped or assigned to a branch on a guess instead of being
          counted and reported as uncertain. A partial total must be labelled as a floor.
        - Any path that carries message content (prompts, responses, tool input or output) toward
          stdout, stderr, logs, error messages, the ledger, PR output or fixtures. Only usage,
          model, ids, timestamps, branch, cwd and attribution may be read.
        - A path built by string concatenation or formatting instead of `Path::join`, or a
          case-sensitive comparison of transcript slugs. Windows is a first-class platform.
        - A pipeline stage reaching past its neighbour (source → attribution → ledger → pricing →
          render), or git, `gh`, network or clock access not behind a trait in core.
        - `#[allow(...)]` where `#[expect(lint, reason = "...")]` belongs.
        - A behaviour change with no test that would have failed before it.
    - path: "crates/branch-tally-core/src/sources/**"
      instructions: |
        This code reads private transcripts. Flag any newly read field beyond usage, model, ids,
        timestamps, branch, cwd and attribution, any new dependency, process or network call, and
        any message content kept in a type that could later be printed or serialized.
    - path: "tests/fixtures/**"
      instructions: |
        Fixtures must be scrubbed transcripts (docs/references/testing.md#fixtures). Flag anything
        that looks like real prompt or response text, source code, a secret, a token, an email
        address or a real user's home directory.
    - path: ".github/workflows/**"
      instructions: |
        Hold the workflow to docs/references/dev_workflow.md "Writing workflows that pass zizmor":
        every action pinned to a full commit SHA with its version as a comment, top-level
        `permissions: {}` with per-job grants, `persist-credentials: false` on checkouts, no
        `${{ }}` inside `run:`, and named secrets instead of `secrets: inherit`.
    - path: "install.*"
      instructions: |
        The installers run on strangers' machines. Flag any download that is not verified
        against a checksum, unquoted variables, and anything that differs between the two
        scripts' behaviour.
    - path: "**/*.md"
      instructions: |
        Markdown is linted by rumdl against .rumdl.toml, so don't report style or wrapping.
        Check that commands, flags, recipes and paths named in the text exist.

  pre_merge_checks:
    # The `pr-title` CI job already enforces Conventional Commits.
    title:
      mode: "off"
    description:
      mode: warning
    custom_checks:
      - name: Linked issue
        mode: warning
        instructions: |
          Pass if the PR description contains a line `Fixes #N` or `Refs #N` naming an issue in
          this repository. Fail otherwise. Dependabot PRs (author dependabot[bot]) pass.

  tools:
    # rumdl lints Markdown with this repository's own config; markdownlint's defaults disagree.
    markdownlint:
      enabled: false
    # Not used here; keep the review to tools that have something to read.
    languagetool:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
